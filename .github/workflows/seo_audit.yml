name: SEO Audit

on:
  workflow_dispatch:
    inputs:
      checks_page_content:
        description: "Check page basics: titles, meta descriptions, headings, image alt text, canonical tags, and structured data"
        required: false
        default: true
        type: boolean
      checks_links:
        description: "Check links: broken links and pages that don't have enough other pages linking to them"
        required: false
        default: true
        type: boolean
      checks_en_jp:
        description: "Check English/Japanese pairing: matching language tags and consistency between the English and Japanese versions of each page"
        required: false
        default: true
        type: boolean
      pages:
        description: "Only check these specific pages instead of the whole site, comma-separated URLs or paths (leave blank to check everything)"
        required: false
        default: ""
      pages_file:
        description: "Path in this repo to a text file (one page per line) listing specific pages to check — upload via GitHub's web UI first (leave blank to check everything)"
        required: false
        default: ""
      max_pages:
        description: "Limit number of pages crawled (leave blank for a full run)"
        required: false
        default: ""
      skip_broken_links:
        description: "Skip broken-link checking (faster run)"
        required: false
        default: false
        type: boolean
      ai_analysis:
        description: "Also run AI keyword/meta/content quality review (costs a small amount per run — needs the ANTHROPIC_API_KEY repo secret)"
        required: false
        default: false
        type: boolean
      ai_pages:
        description: "Restrict AI analysis to these pages only, comma-separated full URLs or paths (only used if ai_analysis is checked; leave blank to analyze every crawled page)"
        required: false
        default: ""
      ai_pages_file:
        description: "Path in this repo to a text file (one URL/path per line) restricting AI analysis to those pages — upload via GitHub's web UI first (only used if ai_analysis is checked)"
        required: false
        default: ""
      search_data:
        description: "Also pull real Search Console + GA4 data per page (needs the GOOGLE_SERVICE_ACCOUNT_JSON repo secret and the fields below)"
        required: false
        default: false
        type: boolean
      gsc_site_url:
        description: "Verified Search Console property (only used if search_data is checked)"
        required: false
        default: "https://www.passot.co.jp/"
      ga4_property_id:
        description: "GA4 numeric Property ID (only used if search_data is checked)"
        required: false
        default: ""
      gsc_import_path:
        description: "Path in this repo to a Search Console export file to import (e.g. gsc-exports/performance.xlsx) — upload it via GitHub's web UI first. Alternative to gsc_site_url when you don't have Search Console admin access."
        required: false
        default: ""
      gsc_links_import_paths:
        description: "Path(s) in this repo to Search Console 'Links' report export(s) (Top linked pages / Top linking sites / Top linking text), space or comma separated (up to 3) — upload via GitHub's web UI first"
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SEO audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=()
          CHECKS=()
          if [ "${{ github.event.inputs.checks_page_content }}" = "true" ]; then CHECKS+=(page_content); fi
          if [ "${{ github.event.inputs.checks_links }}" = "true" ]; then CHECKS+=(links); fi
          if [ "${{ github.event.inputs.checks_en_jp }}" = "true" ]; then CHECKS+=(en_jp); fi
          if [ ${#CHECKS[@]} -eq 0 ]; then
            echo "ERROR: at least one of the three 'Check ...' checkboxes must be checked." >&2
            exit 1
          fi
          if [ ${#CHECKS[@]} -lt 3 ]; then
            ARGS+=(--checks "${CHECKS[@]}")
          fi
          if [ -n "${{ github.event.inputs.pages }}" ]; then
            ARGS+=(--pages "${{ github.event.inputs.pages }}")
          fi
          if [ -n "${{ github.event.inputs.pages_file }}" ]; then
            ARGS+=(--pages-file "${{ github.event.inputs.pages_file }}")
          fi
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS+=(--max-pages "${{ github.event.inputs.max_pages }}")
          fi
          if [ "${{ github.event.inputs.skip_broken_links }}" = "true" ]; then
            ARGS+=(--skip-broken-links)
          fi
          if [ "${{ github.event.inputs.ai_analysis }}" = "true" ]; then
            ARGS+=(--ai-analysis)
            if [ -n "${{ github.event.inputs.ai_pages }}" ]; then
              ARGS+=(--ai-pages "${{ github.event.inputs.ai_pages }}")
            fi
            if [ -n "${{ github.event.inputs.ai_pages_file }}" ]; then
              ARGS+=(--ai-pages-file "${{ github.event.inputs.ai_pages_file }}")
            fi
          fi
          if [ "${{ github.event.inputs.search_data }}" = "true" ]; then
            ARGS+=(--search-data)
            if [ -n "${{ github.event.inputs.gsc_site_url }}" ]; then
              ARGS+=(--gsc-site-url "${{ github.event.inputs.gsc_site_url }}")
            fi
            if [ -n "${{ github.event.inputs.ga4_property_id }}" ]; then
              ARGS+=(--ga4-property-id "${{ github.event.inputs.ga4_property_id }}")
            fi
          fi
          if [ -n "${{ github.event.inputs.gsc_import_path }}" ]; then
            ARGS+=(--gsc-import "${{ github.event.inputs.gsc_import_path }}")
          fi
          if [ -n "${{ github.event.inputs.gsc_links_import_paths }}" ]; then
            IFS=', ' read -ra LINKFILES <<< "${{ github.event.inputs.gsc_links_import_paths }}"
            ARGS+=(--gsc-links-import "${LINKFILES[@]}")
          fi
          python seo_audit.py --output passot_seo_audit.xlsx "${ARGS[@]}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: passot-seo-audit
          path: passot_seo_audit.xlsx
          retention-days: 30
