name: SEO Audit

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Limit number of pages crawled (leave blank for a full run)"
        required: false
        default: ""
      skip_broken_links:
        description: "Skip broken-link checking (faster run)"
        required: false
        default: false
        type: boolean
      ai_analysis:
        description: "Also run AI keyword/meta/content quality review (costs a small amount per run — needs the ANTHROPIC_API_KEY repo secret)"
        required: false
        default: false
        type: boolean
      search_data:
        description: "Also pull real Search Console + GA4 data per page (needs the GOOGLE_SERVICE_ACCOUNT_JSON repo secret and the fields below)"
        required: false
        default: false
        type: boolean
      gsc_site_url:
        description: "Verified Search Console property (only used if search_data is checked)"
        required: false
        default: "https://www.passot.co.jp/"
      ga4_property_id:
        description: "GA4 numeric Property ID (only used if search_data is checked)"
        required: false
        default: ""
      gsc_import_path:
        description: "Path in this repo to a Search Console export file to import (e.g. gsc-exports/performance.xlsx) — upload it via GitHub's web UI first. Alternative to gsc_site_url when you don't have Search Console admin access."
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SEO audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS+=(--max-pages "${{ github.event.inputs.max_pages }}")
          fi
          if [ "${{ github.event.inputs.skip_broken_links }}" = "true" ]; then
            ARGS+=(--skip-broken-links)
          fi
          if [ "${{ github.event.inputs.ai_analysis }}" = "true" ]; then
            ARGS+=(--ai-analysis)
          fi
          if [ "${{ github.event.inputs.search_data }}" = "true" ]; then
            ARGS+=(--search-data)
            if [ -n "${{ github.event.inputs.gsc_site_url }}" ]; then
              ARGS+=(--gsc-site-url "${{ github.event.inputs.gsc_site_url }}")
            fi
            if [ -n "${{ github.event.inputs.ga4_property_id }}" ]; then
              ARGS+=(--ga4-property-id "${{ github.event.inputs.ga4_property_id }}")
            fi
          fi
          if [ -n "${{ github.event.inputs.gsc_import_path }}" ]; then
            ARGS+=(--gsc-import "${{ github.event.inputs.gsc_import_path }}")
          fi
          python seo_audit.py --output passot_seo_audit.xlsx "${ARGS[@]}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: passot-seo-audit
          path: passot_seo_audit.xlsx
          retention-days: 30
